name: PREF-EXP-1D2 Retrieval Quality Calibration

on:
  push:
    branches:
      - research/pref-exp-1d2-retrieval-calibration
  workflow_dispatch:

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Retrieval quality diagnostics
        env:
          PREF_SMOKE_BASE_URL: https://books.conanxin.com
        run: pnpm exec tsx scripts/preference/retrieval-quality-calibration.ts
