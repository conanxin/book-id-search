name: S32 Research canonical Claim refresh reliability

on:
  push:
    branches:
      - test/s32-candidate-claims-canonical-refresh-reliability
  pull_request:
    paths:
      - apps/web/src/research/CandidateClaims.test.tsx
      - .github/workflows/s32-candidate-claims-reliability.yml

permissions:
  contents: read

jobs:
  claim-refresh:
    name: Deterministic Claim refresh and broad Research regression
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Run the focused canonical refresh tests 12 times without retries
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            echo "CANDIDATE_CLAIMS_STRESS_ITERATION=$attempt"
            pnpm exec vitest run apps/web/src/research/CandidateClaims.test.tsx --maxWorkers=1
          done
          echo "CANONICAL_CLAIMS_STRESS_12=PASS"
      - name: Broad Research regression (normal Vitest worker scheduling)
        run: pnpm exec vitest run apps/web/src/research
      - name: Web build and compile
        run: pnpm --filter @book-id-search/web build
      - name: Preserve source diff hygiene
        run: git diff --check HEAD^ HEAD
