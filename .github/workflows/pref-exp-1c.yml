name: PREF-EXP-1C Synthetic Harness

on:
  push:
    branches:
      - research/pref-exp-1c-synthetic-harness
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: PREF-EXP-1C synthetic tests
        run: pnpm exec vitest run scripts/preference/harness.test.ts

      - name: PREF-EXP-1C TypeScript check
        run: pnpm exec tsc -p scripts/preference/tsconfig.json

      - name: API build
        run: pnpm --filter @book-id-search/api build

      - name: Web build
        run: pnpm --filter @book-id-search/web build
