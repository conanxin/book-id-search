name: S32 M1E branch verification

on:
  push:
    branches:
      - feat/s32-m1e-rediscover
  workflow_dispatch:

jobs:
  api-s32:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: API S32 tests
        run: pnpm vitest run apps/api/src/s32
      - name: M1E real PostgreSQL 16
        run: pnpm s32:m1e:check
