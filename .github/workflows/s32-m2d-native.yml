name: S32 M2-D native verification

on:
  push:
    branches:
      - feat/s32-m2d-assessment
  workflow_dispatch:

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Exact head
        run: |
          echo "EXACT_HEAD=$(git rev-parse HEAD)"
          git fetch origin main --no-tags
          echo "MAIN_BASE=$(git rev-parse origin/main)"
      - name: API S32 scoped suite
        run: pnpm vitest run apps/api/src/s32
      - name: Web research scoped suite
        run: pnpm vitest run apps/web/src/research
      - name: M2-C real PostgreSQL regression
        run: pnpm s32:m2c:check
      - name: M2-D real PostgreSQL gate
        run: pnpm s32:m2d:check
      - name: Frozen schema gates
        run: |
          pnpm s32:schema:static
          git diff --exit-code origin/main --             db/migrations/001_s32_core_schema.sql             db/tests/001_s32_schema_assertions.sql             db/tests/002_s32_negative_invariants.sql
          git diff --check
          echo "FROZEN_SQL_CHANGED=NO"
      - name: API build
        run: pnpm --filter @book-id-search/api build
      - name: Web build
        run: pnpm --filter @book-id-search/web build
      - name: Full repository suite (report exact result)
        shell: bash
        run: |
          set +e
          pnpm test
          rc=$?
          echo "FULL_SUITE_EXIT=$rc"
          exit 0

  firefox-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
      - name: Install project + ephemeral Playwright
        run: |
          pnpm install --frozen-lockfile
          pnpm add -Dw @playwright/test@1.55.0 --lockfile=false
          pnpm exec playwright install --with-deps firefox
      - name: Firefox M2-D real-browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          CONTAINER="s32-m2d-browser-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          PASSWORD="$(node -e "console.log(require('crypto').randomBytes(18).toString('hex'))")"
          API_PID=""
          WEB_PID=""

          cleanup() {
            set +e
            [ -n "$API_PID" ] && kill "$API_PID" 2>/dev/null
            [ -n "$WEB_PID" ] && kill "$WEB_PID" 2>/dev/null
            if docker --host unix:///var/run/docker.sock inspect "$CONTAINER" >/dev/null 2>&1; then
              owner="$(docker --host unix:///var/run/docker.sock inspect                 --format '{{ index .Config.Labels "book-id-search.s32-m2d-browser" }}'                 "$CONTAINER")"
              if [ "$owner" = "$CONTAINER" ]; then
                docker --host unix:///var/run/docker.sock rm --force "$CONTAINER" >/dev/null
                echo "DISPOSABLE_BROWSER_CONTAINER_REMOVED=YES"
              else
                echo "DISPOSABLE_BROWSER_CONTAINER_REMOVED=NO"
                return 1
              fi
            fi
          }
          trap cleanup EXIT

          docker --host unix:///var/run/docker.sock run --detach --rm             --name "$CONTAINER"             --label "book-id-search.s32-m2d-browser=$CONTAINER"             --memory=512m             --tmpfs /var/lib/postgresql/data:rw,size=268435456             -p 127.0.0.1::5432             -e POSTGRES_USER=s32browser             -e POSTGRES_PASSWORD="$PASSWORD"             -e POSTGRES_DB=s32_m2d_browser             postgres:16-alpine >/dev/null

          ready=0
          for _ in $(seq 1 60); do
            if docker --host unix:///var/run/docker.sock exec "$CONTAINER"               pg_isready -h 127.0.0.1 -U s32browser -d s32_m2d_browser >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 0.5
          done
          test "$ready" = 1

          PORT="$(
            docker --host unix:///var/run/docker.sock port "$CONTAINER" 5432/tcp |
            sed -n 's/^127\.0\.0\.1:\([0-9][0-9]*\)$/\1/p'
          )"
          test -n "$PORT"

          docker --host unix:///var/run/docker.sock exec -i "$CONTAINER"             psql -X -U s32browser -d s32_m2d_browser -v ON_ERROR_STOP=1 -f -             < db/migrations/001_s32_core_schema.sql
          docker --host unix:///var/run/docker.sock exec -i "$CONTAINER"             psql -X -U s32browser -d s32_m2d_browser -v ON_ERROR_STOP=1 -f -             < scripts/fixtures/s32-m2d-browser.sql

          S32_FEATURES_ENABLED=true           S32_DATABASE_URL="postgresql://s32browser:$PASSWORD@127.0.0.1:$PORT/s32_m2d_browser"           S32_PRIVATE_API_TOKEN="m2d-browser-token"           API_HOST=127.0.0.1           API_PORT=3001             pnpm --filter @book-id-search/api dev > /tmp/m2d-api.log 2>&1 &
          API_PID=$!

          VITE_S32_ENABLED=true             pnpm --filter @book-id-search/web dev > /tmp/m2d-web.log 2>&1 &
          WEB_PID=$!

          api_ready=0
          web_ready=0
          for _ in $(seq 1 80); do
            if curl -fsS -H 'Authorization: Bearer m2d-browser-token'               "http://127.0.0.1:3001/api/private/s32/projects/11111111-1111-4111-8111-111111111111/issues/21111111-1111-4111-8111-111111111111" >/dev/null 2>&1; then
              api_ready=1
            fi
            if curl -fsS http://127.0.0.1:5173/research/projects >/dev/null 2>&1; then
              web_ready=1
            fi
            [ "$api_ready" = 1 ] && [ "$web_ready" = 1 ] && break
            sleep 0.5
          done

          if [ "$api_ready" != 1 ] || [ "$web_ready" != 1 ]; then
            echo "--- API LOG ---"
            tail -n 120 /tmp/m2d-api.log || true
            echo "--- WEB LOG ---"
            tail -n 120 /tmp/m2d-web.log || true
            exit 1
          fi

          M2D_BROWSER_CONTAINER="$CONTAINER"             pnpm exec playwright test scripts/s32-m2d-browser-acceptance.spec.ts               --browser=firefox --workers=1 --reporter=line

          echo "M2_D_REAL_BROWSER=PASS"
          echo "M2_D_MOBILE_390x844=PASS"
