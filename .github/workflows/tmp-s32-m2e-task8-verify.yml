name: S32 M2-E Task 8 exact-tree verification

on:
  push:
    branches: [feat/s32-m2e-issue-resolution]

jobs:
  task8-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6a9e452ff451ae11e2169ff905750cfdc31b62cd
          fetch-depth: 0

      - name: Assert exact target
        run: |
          test "$(git rev-parse HEAD)" = "6a9e452ff451ae11e2169ff905750cfdc31b62cd"
          git status --short

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile

      - name: Task 8 scoped tests
        run: |
          pnpm exec vitest run \
            apps/web/src/research/issue-resolution-draft.test.ts \
            apps/web/src/research/assessment-draft.test.ts \
            apps/web/src/research/candidate-claim-draft.test.ts \
            apps/web/src/research/issue-resolution-api.test.ts

      - name: Web TypeScript
        run: pnpm --filter @book-id-search/web exec tsc --noEmit

      - name: Web build
        run: pnpm --filter @book-id-search/web build

      - name: Diff check
        run: git diff --check
