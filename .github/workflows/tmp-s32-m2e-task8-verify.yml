name: S32 M2-E Task 8 exact-tree verification

on:
  push:
    branches: [feat/s32-m2e-issue-resolution]
  pull_request:
    branches: [main]

jobs:
  task8-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6a9e452ff451ae11e2169ff905750cfdc31b62cd
          fetch-depth: 0
      - name: Assert exact target
        run: test "$(git rev-parse HEAD)" = "6a9e452ff451ae11e2169ff905750cfdc31b62cd"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile
      - name: Add diagnostic logging only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("apps/web/src/research/issue-resolution-draft.ts")
          s = p.read_text()
          old = 'if (!isReceipt(receipt)) throw new Error("Pending Issue Resolution receipt is invalid.");'
          new = '''if (!isReceipt(receipt)) {
            console.error("TASK8_RECEIPT_DIAG", JSON.stringify(receipt), {
              receiptPrototype: Object.getPrototypeOf(receipt)?.constructor?.name ?? null,
              commandPrototype: Object.getPrototypeOf(receipt.command)?.constructor?.name ?? null,
              idempotencyKey: receipt.idempotencyKey,
              createdAt: receipt.createdAt,
            });
            throw new Error("Pending Issue Resolution receipt is invalid.");
          }'''
          if old not in s:
              raise SystemExit("diagnostic target not found")
          p.write_text(s.replace(old, new))
          PY
      - name: Task 8 diagnostic tests
        run: pnpm exec vitest run apps/web/src/research/issue-resolution-draft.test.ts --reporter=verbose
