name: S32 M2-E Task 10 current/history verification

on:
  push:
    branches: [feat/s32-m2e-issue-resolution]
  pull_request:
    branches: [main]

jobs:
  task10-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e17f936a416c192fede7d1e86f0f91d9ab2030fc
          fetch-depth: 0
      - name: Assert exact target
        run: |
          test "$(git rev-parse HEAD)" = "e17f936a416c192fede7d1e86f0f91d9ab2030fc"
          git status --short
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile
      - name: Task 10 scoped tests
        run: |
          pnpm exec vitest run \
            apps/web/src/research/IssueResolutionCurrent.test.tsx \
            apps/web/src/research/IssueResolutionHistory.test.tsx \
            apps/web/src/research/IssueResolutionDetail.test.tsx \
            apps/web/src/research/IssueResolutionComposer.test.tsx \
            apps/web/src/research/ResearchIssueDetail.test.tsx \
            apps/web/src/research/issue-resolution-draft.test.ts \
            apps/web/src/research/issue-resolution-api.test.ts
      - name: Web TypeScript
        run: pnpm --filter @book-id-search/web exec tsc --noEmit
      - name: Web build
        run: pnpm --filter @book-id-search/web build
      - name: Diff check
        run: git diff --check
