name: Research v0 pilot verification

on:
  push:
    branches:
      - feat/research-v0-pilot
  workflow_dispatch:

jobs:
  research-v0:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Research v0 tests
        run: pnpm vitest run apps/api/src/research-v0
      - name: API build
        run: pnpm --filter @book-id-search/api build
