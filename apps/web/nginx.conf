server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # S27D-LOG-PRIVACY: do not write the request line (which includes the raw
  # query string `?q=...`) for any /api/private/* route. The private
  # endpoints carry private-token bearer auth and user-supplied search terms;
  # logging them to /var/log/nginx/access.log (= /dev/stdout = `docker logs`)
  # would leak the user's private search history to anyone with read access
  # to the container logs.
  #
  # This block must precede the generic /api/ block so it wins the longest-
  # prefix match. Behaviour for /api/private/* is otherwise identical to
  # /api/: same proxy_pass, same forwarded headers.
  location /api/private/ {
    access_log off;
    # The trailing /api/private/ in proxy_pass is REQUIRED: nginx strips the
    # matched prefix (/api/private/) before forwarding, so without the trailing
    # /api/private/ here the upstream would receive /weread/notes instead of
    # /api/private/weread/notes. The original /api/ block keeps /api/ for the
    # same reason.
    proxy_pass http://api:3001/api/private/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://api:3001/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
